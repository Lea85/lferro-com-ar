<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leandro Ferro · lferro.com.ar</title>
  <meta name="description" content="Sitio personal de Leandro Ferro. Proyectos, experimentos y herramientas." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c1917'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='16' fill='%23f6f1e8'%3ELF%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f3f6f2;
      --paper: #ffffff;
      --ink: #17211c;
      --muted: #5c6b63;
      --line: #e1e8e3;
      --line-strong: #c9d4cc;
      --accent: #0c8f62;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    body { background: var(--bg); }

    a { color: inherit; }

    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 36px 24px 72px;
    }

    header {
      display: grid;
      gap: 28px;
      padding-bottom: 36px;
      border-bottom: 1px solid var(--line-strong);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
    }

    .mark b {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--accent);
      color: #f4fff8;
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0;
      text-transform: none;
    }

    .socials {
      display: flex;
      gap: 18px;
    }

    .socials a {
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      color: var(--ink);
      border-bottom: 1px solid transparent;
    }

    .socials a:hover { border-bottom-color: var(--ink); }

    .intro h1 {
      margin: 0 0 10px;
      font-weight: 700;
      font-size: clamp(46px, 8vw, 76px);
      letter-spacing: -0.03em;
      line-height: 0.92;
    }

    .intro p {
      margin: 0;
      max-width: 34rem;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.5;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 36px 0 16px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .section-head span {
      font-size: 13px;
      color: var(--muted);
    }

    .projects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .project {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 168px;
      padding: 18px 18px 16px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      text-decoration: none;
      color: var(--ink);
      transition: border-color .15s ease, transform .15s ease;
    }

    .project:hover {
      border-color: var(--ink);
      transform: translateY(-2px);
    }

    .project.disabled {
      opacity: 0.6;
      cursor: default;
    }

    .project.disabled:hover {
      border-color: var(--line);
      transform: none;
    }

    .proj-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .proj-icon {
      font-size: 26px;
      line-height: 1;
    }

    .proj-go {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .project:hover .proj-go { color: var(--accent); }

    .proj-name {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .proj-name .wip {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 2px 6px;
    }

    .proj-desc {
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.45;
    }

    footer {
      margin-top: 48px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    footer a { color: var(--muted); }

    @media (max-width: 680px) {
      .wrap { padding: 24px 16px 56px; }
      .projects { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; }
      footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="topbar">
        <a class="mark" href="/"><b>LF</b> lferro.com.ar</a>
        <nav class="socials">
          <a href="https://www.linkedin.com/in/leandrodferro/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="mailto:hola@lferro.com.ar">Email</a>
        </nav>
      </div>
      <div class="intro">
        <h1>Leandro Ferro</h1>
        <p>Proyectos, experimentos y herramientas que armo en el camino.</p>
      </div>
    </header>

    <section>
      <div class="section-head">
        <h2>Proyectos</h2>
        <span id="count"></span>
      </div>
      <div class="projects" id="projects"></div>
    </section>

    <footer>
      <span>© <span id="year"></span> Leandro Ferro</span>
      <a href="https://www.linkedin.com/in/leandrodferro/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </footer>
  </div>

  <script>
    const PROJECTS = [
      {
        name: 'Soy Jime',
        icon: '🎨',
        desc: 'Sitio personal y portfolio de Jime.',
        href: 'https://www.soyjime.com.ar',
        external: true
      },
      {
        name: 'FrancisProde',
        icon: '👶',
        desc: 'Prode entre amigos: ¿qué día y a qué hora nace Francisco?',
        href: '/francisprode/',
        external: false
      },
      {
        name: 'Prode Fifa 2026',
        icon: '⚽',
        desc: 'Prode del Mundial 2026 entre amigos.',
        href: '/prodeFifa/',
        external: false
      },
      {
        name: 'Tablero de Cambios',
        icon: '📋',
        desc: 'Kanban para gestionar proyectos tecnológicos.',
        href: '/tablero/',
        external: false
      },
      {
        name: 'Visor de Visio',
        icon: '📐',
        desc: 'Visualizador web de archivos .vsdx sin instalar Visio.',
        href: '/visorvisio/',
        external: false
      },
      {
        name: 'Uniq Positivo',
        icon: '✨',
        desc: 'Centro de belleza y galería de arte en CABA.',
        href: 'https://www.uniqpositivo.com/',
        external: true
      },
      {
        name: 'Gestión FerroSan',
        icon: '🔧',
        desc: 'E-commerce y gestión de la ferretería.',
        href: 'https://ferreteria-ecommerce-psi.vercel.app/',
        external: true
      },
      {
        name: 'Servileasing',
        icon: '🚦',
        desc: 'Descarga masiva de actas de infracción de tránsito.',
        href: 'https://servileasing-leandro85-5643s-projects.vercel.app/',
        external: true
      }
    ];

    const grid = document.getElementById('projects');
    PROJECTS.forEach(p => {
      const isLink = !!p.href;
      const el = document.createElement(isLink ? 'a' : 'div');
      el.className = 'project' + (isLink ? '' : ' disabled');
      if (isLink) {
        el.href = p.href;
        if (p.external) {
          el.target = '_blank';
          el.rel = 'noopener noreferrer';
        }
      }
      const action = isLink ? (p.external ? 'Abrir' : 'Entrar') : 'Pronto';
      el.innerHTML = `
        <div class="proj-top">
          <div class="proj-icon" aria-hidden="true">${p.icon}</div>
          <div class="proj-go">${action}</div>
        </div>
        <div class="proj-name">
          ${p.name}
          ${p.wip ? '<span class="wip">WIP</span>' : ''}
        </div>
        <div class="proj-desc">${p.desc}</div>
      `;
      grid.appendChild(el);
    });

    document.getElementById('count').textContent = PROJECTS.length + ' en total';
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
