<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leandro Ferro · lferro.com.ar</title>
  <meta name="description" content="Sitio personal de Leandro Ferro. Proyectos, experimentos y herramientas." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%236366F1'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Arial,sans-serif' font-size='13' font-weight='700' fill='%23000000'%3ELF%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --color-primary: #6366f1;
      --color-on-primary: #000000;
      --color-accent: #16a34a;
      --color-accent-text: #15803d;
      --color-on-accent: #000000;
      --color-background: #eef2ff;
      --color-foreground: #312e81;
      --color-card: #ffffff;
      --color-muted: #ebeff9;
      --color-muted-foreground: #475569;
      --color-border: #c7d2fe;
      --color-ring: #6366f1;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --space-12: 48px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      color: var(--color-foreground);
      background: var(--color-background);
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    a { color: inherit; }

    :focus { outline: none; }

    :focus-visible {
      outline: 2px solid var(--color-ring);
      outline-offset: 3px;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: var(--space-8) var(--space-6) 72px;
    }

    header {
      display: grid;
      gap: var(--space-8);
      padding-bottom: var(--space-8);
      border-bottom: 1px solid var(--color-border);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
    }

    .mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-muted-foreground);
      text-decoration: none;
    }

    .mark b {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      background: var(--color-primary);
      color: var(--color-on-primary);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0;
      text-transform: none;
    }

    .socials {
      display: flex;
      gap: var(--space-2);
    }

    .socials a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px;
    }

    .socials a:hover { background: var(--color-card); color: var(--color-primary); }

    .intro h1 {
      margin: 0 0 var(--space-3);
      font-weight: 700;
      font-size: clamp(40px, 7vw, 64px);
      letter-spacing: -0.04em;
      line-height: 0.95;
    }

    .intro p {
      margin: 0;
      max-width: 36rem;
      color: var(--color-muted-foreground);
      font-size: 18px;
      line-height: 1.45;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-4);
      margin: var(--space-8) 0 var(--space-4);
    }

    .section-head h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .section-head span {
      font-size: 14px;
      color: var(--color-muted-foreground);
    }

    .projects {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--color-border);
    }

    .project {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      align-items: center;
      gap: var(--space-4);
      min-height: 76px;
      padding: var(--space-4) var(--space-2);
      border-bottom: 1px solid var(--color-border);
      text-decoration: none;
      color: var(--color-foreground);
      cursor: pointer;
      background: transparent;
      transition: background-color 180ms ease;
    }

    .project:hover { background: var(--color-card); }

    .project.disabled {
      opacity: 0.55;
      cursor: default;
    }

    .proj-icon {
      font-size: 24px;
      line-height: 1;
      text-align: center;
    }

    .proj-name {
      display: block;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .proj-name .wip {
      margin-left: 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-muted-foreground);
    }

    .proj-desc {
      display: block;
      margin-top: 2px;
      color: var(--color-muted-foreground);
      font-size: 14.5px;
      line-height: 1.4;
    }

    .proj-go {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--color-accent-text);
      white-space: nowrap;
    }

    .proj-go svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    footer {
      margin-top: var(--space-12);
      display: flex;
      justify-content: space-between;
      gap: var(--space-4);
      color: var(--color-muted-foreground);
      font-size: 14px;
    }

    footer a {
      color: var(--color-foreground);
      font-weight: 600;
    }

    @media (max-width: 640px) {
      .wrap { padding: var(--space-6) var(--space-4) 56px; }
      .project {
        grid-template-columns: 32px 1fr;
        align-items: start;
      }
      .proj-go {
        grid-column: 2;
        margin-top: 6px;
      }
      footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      .project { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="topbar">
        <a class="mark" href="/"><b>LF</b> lferro.com.ar</a>
        <nav class="socials" aria-label="Contacto">
          <a href="https://www.linkedin.com/in/leandrodferro/" target="_blank" rel="noopener noreferrer">LinkedIn<span class="sr-only">, se abre en una pestaña nueva</span></a>
          <a href="mailto:hola@lferro.com.ar">Email</a>
        </nav>
      </div>
      <div class="intro">
        <h1>Leandro Ferro</h1>
        <p>Proyectos, experimentos y herramientas que armo en el camino. Elegí uno para entrar.</p>
      </div>
    </header>

    <section aria-labelledby="proyectos-titulo">
      <div class="section-head">
        <h2 id="proyectos-titulo">Proyectos</h2>
        <span id="count"></span>
      </div>
      <div class="projects" id="projects"></div>
    </section>

    <footer>
      <span>© <span id="year"></span> Leandro Ferro</span>
      <a href="https://www.linkedin.com/in/leandrodferro/" target="_blank" rel="noopener noreferrer">LinkedIn<span class="sr-only">, se abre en una pestaña nueva</span></a>
    </footer>
  </div>

  <script>
    const EXTERNAL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>';

    const PROJECTS = [
      {
        name: 'Soy Jime',
        icon: '🎨',
        desc: 'Sitio personal y portfolio de Jime.',
        href: 'https://www.soyjime.com.ar',
        external: true
      },
      {
        name: 'FrancisProde',
        icon: '👶',
        desc: 'Prode entre amigos: ¿qué día y a qué hora nace Francisco?',
        href: '/francisprode/',
        external: false
      },
      {
        name: 'Prode Fifa 2026',
        icon: '⚽',
        desc: 'Prode del Mundial 2026 entre amigos.',
        href: '/prodeFifa/',
        external: false
      },
      {
        name: 'Tablero de Cambios',
        icon: '📋',
        desc: 'Kanban para gestionar proyectos tecnológicos.',
        href: '/tablero/',
        external: false
      },
      {
        name: 'Visor de Visio',
        icon: '📐',
        desc: 'Visualizador web de archivos .vsdx sin instalar Visio.',
        href: '/visorvisio/',
        external: false
      },
      {
        name: 'Uniq Positivo',
        icon: '✨',
        desc: 'Centro de belleza y galería de arte en CABA.',
        href: 'https://www.uniqpositivo.com/',
        external: true
      },
      {
        name: 'Gestión FerroSan',
        icon: '🔧',
        desc: 'E-commerce y gestión de la ferretería.',
        href: 'https://ferreteria-ecommerce-psi.vercel.app/',
        external: true
      },
      {
        name: 'Servileasing',
        icon: '🚦',
        desc: 'Descarga masiva de actas de infracción de tránsito.',
        href: 'https://servileasing-leandro85-5643s-projects.vercel.app/',
        external: true
      }
    ];

    const grid = document.getElementById('projects');
    PROJECTS.forEach(p => {
      const isLink = !!p.href;
      const el = document.createElement(isLink ? 'a' : 'div');
      el.className = 'project' + (isLink ? '' : ' disabled');
      if (isLink) {
        el.href = p.href;
        if (p.external) {
          el.target = '_blank';
          el.rel = 'noopener noreferrer';
        }
      }
      const action = isLink ? (p.external ? 'Abrir sitio' : 'Entrar') : 'Pronto';
      const extra = p.external ? '<span class="sr-only">, se abre en una pestaña nueva</span>' : '';
      el.innerHTML = `
        <div class="proj-icon" aria-hidden="true">${p.icon}</div>
        <div>
          <span class="proj-name">${p.name}${p.wip ? '<span class="wip">WIP</span>' : ''}</span>
          <span class="proj-desc">${p.desc}</span>
        </div>
        <span class="proj-go">${action}${p.external ? EXTERNAL_ICON : ''}${extra}</span>
      `;
      grid.appendChild(el);
    });

    document.getElementById('count').textContent = PROJECTS.length + ' en total';
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
